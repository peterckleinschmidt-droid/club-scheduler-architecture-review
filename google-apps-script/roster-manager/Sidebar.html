<!DOCTYPE html><html><head><base target="_top"><style>
body{font-family:Arial,sans-serif;margin:0;color:#172033}.head{background:#16324f;color:#fff;padding:16px}.wrap{padding:12px}.status{padding:10px;border:1px solid #bfd4ff;border-radius:9px;background:#eef5ff;margin-bottom:10px;font-weight:700}.good{background:#e2f0d9;border-color:#b7d7a8}.bad{background:#fce8e6;border-color:#efb8b3}.card{border:1px solid #d8dee8;border-radius:10px;padding:12px;margin:9px 0}.current{border:2px solid #2563eb;background:#eff6ff}.done{background:#f0fdf4}.locked{background:#f8fafc;color:#64748b}.row{display:flex;gap:10px}.num{min-width:24px;height:24px;border-radius:50%;background:#e8eef5;text-align:center;line-height:24px;font-weight:700}.title{font-weight:700}.muted{color:#667085;font-size:12px;line-height:1.45}button{border:0;border-radius:8px;padding:10px 12px;background:#16324f;color:#fff;cursor:pointer;font-weight:700;margin-top:9px;width:100%}button.secondary{background:#e8eef5;color:#16324f}.operation-title{font-size:14px;font-weight:700}.operation-detail{margin-top:3px;color:#667085;font-size:12px;font-weight:400}.operation-time{margin-top:8px;color:#344054;font-size:12px;font-weight:600}.diag{display:none;margin-top:8px;padding:8px;background:#f8fafc;border-radius:6px;font:11px monospace;white-space:pre-wrap}
</style></head><body><div class="head"><div style="font-size:18px;font-weight:700">Google Workflow</div></div><div class="wrap"><div id="status" class="status">Opening workflow</div><div id="app"></div><button id="diagButton" class="secondary">Troubleshooting details</button><div id="diag" class="diag"></div></div><script>
(function(){var app=document.getElementById('app'),statusBox=document.getElementById('status'),diag=document.getElementById('diag'),state={},timer=null,started=0;
function status(text,kind){statusBox.className='status '+(kind||'');statusBox.textContent=text}
function btn(label,fn,secondary){var b=document.createElement('button');b.type='button';b.textContent=label;if(secondary)b.className='secondary';b.addEventListener('click',fn);return b}
function card(n,title,detail,mode,controls){var o=document.createElement('div');o.className='card row '+mode;var x=document.createElement('div');x.className='num';x.textContent=String(n);var body=document.createElement('div');body.style.flex='1';var h=document.createElement('div');h.className='title';h.textContent=title;var d=document.createElement('div');d.className='muted';d.textContent=detail;body.appendChild(h);body.appendChild(d);if(mode==='current'&&controls)controls.forEach(function(c){body.appendChild(c)});o.appendChild(x);o.appendChild(body);return o}
function shell(){app.textContent='';['Set up this workbook','Create the student form','Connect the student form','Prepare choices for matching','Create draft rosters in Scheduler','Review draft rosters','Create printable rosters','Finish in Scheduler'].forEach(function(t,i){app.appendChild(card(i+1,t,'','locked'))})}
function fail(e){clearInterval(timer);status('Workflow could not be opened','bad');diag.textContent=e&&e.message?e.message:String(e||'Google did not respond.');app.textContent='';app.appendChild(btn('Try again',load,true))}
function call(name,success){var r=google.script.run.withFailureHandler(fail).withSuccessHandler(success);r[name]()}
function working(label){started=Date.now();clearInterval(timer);function draw(){var seconds=Math.floor((Date.now()-started)/1000);statusBox.className='status';statusBox.innerHTML='<div class="operation-title"></div><div class="operation-detail">Keep this panel open.</div><div class="operation-time"></div>';statusBox.querySelector('.operation-title').textContent=label;statusBox.querySelector('.operation-time').textContent=seconds+' seconds elapsed'}draw();timer=setInterval(draw,1000)}
function action(name,label){working(label);call(name,function(){clearInterval(timer);load()})}
function openScheduler(){if(state.schedulerUrl){window.open(state.schedulerUrl,'_blank');return}working('Opening Scheduler');call('openSchedulerWorkflow',function(){clearInterval(timer);load()})}
function load(){clearInterval(timer);shell();status('Opening workflow');call('getWorkflowState',render)}
function render(d){state=d||{};status('Ready','good');var current=1;if(d.setupComplete)current=2;if(d.formId)current=3;if(d.formConnected)current=4;if(Number(d.codedChoiceCount||0)>0)current=5;if(Number(d.draftCount||0)>0)current=6;if(d.validatedAt)current=7;if(d.printableAt)current=8;function mode(n){return n<current?'done':n===current?'current':'locked'}app.textContent='';app.appendChild(card(1,'Set up this workbook',d.setupComplete?'Complete':'Prepare the workbook once.',mode(1),[btn('Complete first-time setup',function(){action('runFirstTimeSetupFromWorkflow','Setting up workbook')})]));app.appendChild(card(2,'Create the student form',d.formId?'Form found':'Create the form in Scheduler, return here, and choose Find student form.',mode(2),[btn('Open Scheduler',openScheduler),btn('Find student form',function(){action('checkForStudentFormFromWorkflow','Checking for student form')},true)]));app.appendChild(card(3,'Connect the student form',d.formConnected?'Connected':'Connect the form so this workbook can receive student responses.',mode(3),[btn('Connect student form',function(){action('connectStudentFormResponses','Connecting student form')})]));app.appendChild(card(4,'Prepare choices for matching',Number(d.codedChoiceCount||0)>0?String(Number(d.codedChoiceCount||0))+' students ready for matching':'Collect the latest responses, remove names, and prepare choices for Scheduler.',mode(4),[btn('Prepare student choices',function(){action('refreshChoicesIncludingSeededTests','Preparing student choices')}),btn('Enter paper responses',function(){action('openTeacherEnteredChoices','Opening paper response entry')},true),btn('Review prepared choices',function(){action('openCodedChoicesExportFromWorkflow','Opening prepared choices')},true)]));app.appendChild(card(5,'Create draft rosters in Scheduler',Number(d.draftCount||0)>0?'Draft rosters received':'Open Scheduler, run matching, resolve any required club decisions, and send the draft rosters to Google. Then return here and refresh.',mode(5),[btn('Open Scheduler to create draft rosters',openScheduler),btn('Refresh workflow',load,true)]));var rc=[];rc.push(btn(d.editorReady?'Open roster editor':'Prepare roster editor',function(){action(d.editorReady?'openEditDraftRosters':'buildEditDraftRosters',d.editorReady?'Opening roster editor':'Preparing roster editor')}));rc.push(btn('Check roster changes',function(){action('validateEditedRosters','Checking roster changes')},true));app.appendChild(card(6,'Review draft rosters',d.validatedAt?'Roster changes checked':d.editorReady?'Review names, make changes, then check them.':'Prepare the roster editor to review student names.',mode(6),rc));app.appendChild(card(7,'Create printable rosters',d.printableAt?'Printable rosters created':'Create and inspect both the club and homeroom documents.',mode(7),[btn('Create printable rosters',function(){action('createPrintableRosterDocs','Creating printable rosters')})]));app.appendChild(card(8,'Finish in Scheduler','Return to Scheduler, import the reviewed rosters, and finalize the session.',mode(8),[btn('Open Scheduler to finish',openScheduler)]));app.appendChild(btn('Refresh workflow',load,true));diag.textContent='Status updated: '+new Date().toLocaleString()}
document.getElementById('diagButton').addEventListener('click',function(){diag.style.display=diag.style.display==='block'?'none':'block'});shell();load()}());
</script></body></html>
